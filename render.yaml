services:
  - type: web
    name: project-atlas-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPERATOR_PIN
        value: "2026"
      - key: DATABASE_URL
        sync: false

  - type: web
    name: project-atlas-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false